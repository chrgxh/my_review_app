events {}

http {
    # --- Global request protection (per client IP) ---
    # Route-specific limits are handled in FastAPI via SlowAPI.
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name revlytio.com;
        return 301 https://www.revlytio.com$request_uri;
    }

    server {
        listen 80;
        server_name www.revlytio.com;
        return 301 https://www.revlytio.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name revlytio.com;

        ssl_certificate /etc/letsencrypt/live/revlytio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/revlytio.com/privkey.pem;

        return 301 https://www.revlytio.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.revlytio.com;

        ssl_certificate /etc/letsencrypt/live/revlytio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/revlytio.com/privkey.pem;

        location / {
            limit_req zone=general_limit burst=30 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}